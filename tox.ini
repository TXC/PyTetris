[tox]
package = wheel
wheel_build_env = .pkg
requires =
    tox>=4
env_list = lint, typecheck, py{310,311,312,313,314,py}, coverage
minversion = 4.50.0
skipsdist = False
isolated_build = True

[flake8]
extend-ignore = E741, W605, E501
extend-exclude = .vscode,.github,old,build,dist,.venv
#max-complexity = 10

[gh-actions]
python =
    3.10: py310, coverage
    3.11: py311, coverage
    3.12: py312, coverage
    3.13: py313, coverage
    3.14: py314, coverage
    pypy-3.10: pypy, coverage

[deps]
py3x =

[base]
target_version = py310
skip_install = true
#coverage_percent = 80
coverage_percent = 75
coverage_percent_app = 60
#coverage_percent_lib = 90
coverage_percent_lib = 85
coverage_deps =
    {[testenv]deps}
    coverage>=7
    pytest>=9.0.3
    pytest-cov>=7.1.0
    pytest-qt>=4.5.0

[testenv]
deps =
    -e ./libs/editor-lib
    -e ./apps/save-editor
    -e ./apps/vehicle-editor
# This ensures your 'save-editor' is also installed in editable mode
usedevelop = true
allowlist_externals =
    echo
    false
# This and the next few testenvs are a workaround for
# https://github.com/tox-dev/tox/issues/2858.
commands =
    echo "Unrecognized environment name {envname}"
    python -VV
    false

[testenv:py{310,311,312,313,314,py}]
description = run the tests for {env_name}
depends =
    lint
    typecheck
deps =
    {[testenv]deps}
    pytest>=9.0.3
    pytest-cov>=7.1.0
    pytest-qt>=4.5.0
allowlist_externals = make
commands =
    make test

[testenv:lint]
description = run linter and check formatting
skip_install = True
#skip_install = {[base]skip_install}
deps = ruff
allowlist_externals = make
commands =
    make lint

[testenv:typecheck]
description = run type checks
deps =
    {[testenv]deps}
    mypy>=1.20.0
allowlist_externals = make
commands =
    make typecheck

[testenv:format]
description = fix formatting and imports
skip_install = True
deps = ruff
allowlist_externals = make
commands =
    make format

[testenv:coverage]
skip_install = {[base]skip_install}
description = run the tests coverage
deps =
    coverage>=7
ignore_errors = true
allowlist_externals = make
commands =
    make coverage
