[build-system]
requires        = ["setuptools>=61.0.0", "wheel"]
build-backend   = "setuptools.build_meta"

[project]
name = "pytetris"
version = "0.1.0"
authors = [
    { name = "Jonas Marklén", email = "txc@txc.se" },
]
license = { text = "WTFPL" }
description = "PyTetris"
readme = "README.rst"
requires-python = ">=3.14"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "PyQt6>=6.10.2",
    "virtualenv",
    "tomli>=2.0",
    "tox>=4.50.0",
]

[project.urls]
"Homepage" = "https://github.com/TXC/pytetris"

[project.optional-dependencies]
dev = [
    "pytest>=9.0.3",
    "pytest-mock>=3.0",
    "pytest-cov>=7.1.0",
    "pytest-qt>=4.5.0",
    "ruff>=0.15.0",
    "mypy>=1.20.0",
    "coverage[toml]>=7",
]
docs = [
    'Sphinx>=1.0',
    'sphinx_rtd_theme>=1.3',
    'tomli>=2.0',
]

[project.scripts]
pytetris = "pytetris.main:main"


#[tool.setuptools.packages.find]
#where = ["."]
#include = ["apps.*", "libs.*"]

#[bdist_wheel]
#universal = 1

[tool.mypy]
strict = true
ignore_missing_imports = true
pretty = true
check_untyped_defs = true
#warn_return_any = true
#warn_unused_configs = true
exclude = '''(?x)(
    ^docs/[\w]+\.py$
    | ^apps/save-editor/main\.py$
    | ^apps/vehicle-editor/main\.py$
    | ^apps/.*/tests/.*\.py$
    | ^libs/.*/tests/.*\.py$
    | ^tests/.*\.py$
)'''


[tool.ruff]
# Target the entire monorepo
src = ["apps", "libs"]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
# E/F = Flake8 basics, I = Isort, C90 = Complexity, UP = PyUpgrade
select = ["E", "F", "I", "C90", "UP", "B"]
ignore = [
    "E741", # Ambiguous variable name
    "W605", # Invalid escape sequence
    "E501", # Line too long (already handled by formatter)
]

[tool.ruff.lint.mccabe]
# This replaces your max-complexity = 10
max-complexity = 10

[tool.ruff.lint.isort]
# Tell Ruff these are your local projects so imports are grouped correctly
known-first-party = [
    "pytetris",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"


[tool.pytest.ini_options]
minversion = "9.0"
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
testpaths = ["apps", "libs", "tests"]
pythonpath = [
  "pytetris",
]
addopts = [
    "--import-mode=importlib",
    "--strict-markers",
    "--tb=short",
    "--disable-warnings",
    "-ra",
]
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "slow: Slow-running tests",
    "gui: GUI tests (requires display)",
]

[tool.coverage.run]
branch = true
parallel = true
source = [
    "libs/pytetris-core/pytetris_core",
    "libs/pytetris-i18n/pytetris_i18n",
    "libs/pytetris-qt/pytetris_qt",
    "apps/pytetris/pytetris",
]
#omit = [
#    "tests/*"
#]

[tool.coverage.paths]
# This tells coverage: "These directories are actually the same code"
source = [
    ".",                            # Local source
    "**/site-packages",             # Installed source in Tox
    "*/site-packages",
]

[tool.coverage.report]
#omit = [
#    "tests/*"
#]
# Regexes for lines to exclude from consideration
exclude_also = [
    # Have to re-enable the standard pragma
    "pragma: no cover",

    # Don't complain about missing debug-only code:
    "def __repr__",
    "if self\\.debug",

    # Don't complain if tests don't hit defensive assertion code:
    "raise AssertionError",
    "raise NotImplementedError",

    # Don't complain if non-runnable code isn't run:
    "if 0:",
    "if __name__ == .__main__.:",

    # Don't complain about abstract methods, they aren't run:
    "@(abc\\.)?abstractmethod",

    # Don't complain about type checking blocks
    "if TYPE_CHECKING:",
    "if typing.TYPE_CHECKING:",

    # Don't complain about protocol methods
    "@Protocol",
    "\\.\\.\\.",

    # Skip pass statements
    "pass",

    # Don't complain about GUI event handlers in testing
    # "QApplication.exec",
]
precision = 2
show_missing = true
ignore_errors = true

[tool.coverage.html]
directory = "htmlcov"
